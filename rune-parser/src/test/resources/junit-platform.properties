# JUnit 5 execution configuration.
#
# Tests run SEQUENTIALLY by default. Empirically, parallel execution makes the
# corpus regression test SLOWER (6:45 vs 6:08), because ANTLR's DFA cache is
# warm-shared across sequential parses but contends across threads. The unit
# tests are already fast (<1s each); the bottleneck is the corpus regression
# (~260s) and structural comparison (~107s) which are CPU/I/O-bound on parsing.
#
# Future optimisation options (not enabled by default):
#   1. Run corpus regression in a separate Maven profile, opt-in only.
#   2. Cache parser results at the file level so repeated runs skip unchanged
#      files (would benefit incremental dev workflow).
#   3. Parallelise only the unit tests via @Execution(CONCURRENT), keeping
#      heavy regression tests sequential.

junit.jupiter.execution.parallel.enabled=false

# ---- Jqwik configuration (H19) ----
# Jqwik 1.6+ reads its config from this file (prefix jqwik.) and no longer
# from jqwik.properties. Keys authoritatively verified against
# net.jqwik.engine.JqwikProperties.load() bytecode in jqwik-engine 1.9.1.
# Rationale is kept in the development audit "p1-test-harness-audit" §Q2/§Q3.

# Shrink database lives under target/ so mvn clean resets it.
jqwik.database=target/jqwik-database

# Default property-generation budget. pr-gate overrides lower;
# nightly profile overrides higher via -Djqwik.tries.default.
jqwik.tries.default=100

# Fail a property if more than one-in-N generated inputs are rejected
# by filters (prevents filter-starvation from quietly passing as "OK").
jqwik.maxdiscardratio.default=5

# When a property fails: first replay the failing sample, then replay
# the previous seed. Avoids noisy non-deterministic repro.
jqwik.failures.after.default=SAMPLE_FIRST

# Bounded shrinking (audit Q2). Unbounded shrinking can run for
# minutes on complex grammars; bounded caps per-failure shrink effort.
jqwik.shrinking.default=BOUNDED

# Use randomised input generation by default (the Jqwik alternative is
# EXHAUSTIVE, which enumerates the domain for small-bounded types and is
# rarely what we want for grammar-shape PBT). Note: this key controls
# generation mode, NOT concurrency — thread-parallel is disabled
# separately in this file above (`junit.jupiter.execution.parallel.enabled`)
# and the one-JVM-at-a-time constraint (audit Q3) is enforced via
# Surefire `forkCount=1C` in pom.xml.
jqwik.generation.default=RANDOMIZED

# Report cleanly — surface failures, suppress the full report noise
# on green runs.
jqwik.reporting.usejunitplatform=false
jqwik.reporting.onlyfailures=true
