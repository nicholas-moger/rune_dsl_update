# Written by maven resource filtering from the ACTIVE leg profile in pom.xml.
# Read back at runtime by demo.harness.exec.LegPins, so a jar always reports the
# dependency set it was actually built with - and refuses to run under a --leg
# that does not match. Never edit by hand; edit the profile properties instead.
leg=${exec.leg}
runtime.gav=${exec.runtime.gav}
runtime.resolved=${exec.runtime.resolved}
jackson.version=${exec.jackson.version}
commonsLang3.version=${exec.commonsLang3.version}
guice.version=${exec.guice.version}
xtend.present=${exec.xtend.present}
