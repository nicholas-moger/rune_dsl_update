<tspan x="24" dy="0" xml:space="preserve">Build versioned</tspan>
<tspan x="24" dy="35" xml:space="preserve">model libraries</tspan>
</text>
<text x="24" y="119" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">Source → parse and check → generate</tspan>
<tspan x="24" dy="26" xml:space="preserve">Then compile, test and package.</tspan>
</text>
