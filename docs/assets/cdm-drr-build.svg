<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="970" viewBox="0 0 1120 970" role="img" aria-labelledby="title desc">
<title id="title">Build versioned model libraries</title>
<desc id="desc">Selected model and Rune toolchain versions configure the build; they are not a transformation stage. Rune CDM/DRR source feeds an Xtext-generated ANTLR 3 lexer/parser for lexing and parsing .rosetta source. Xtext integrates that parsing with EMF source-model objects and resource/reference handling. The following model/services card represents those same source objects and Rune semantic responsibilities, not a second model conversion. Rune services resolve references and check scoping, types, cardinality and validation. Java generators implemented in Java and Xtend produce Java source. Compilation, tests and packaging create versioned libraries. JVM labels identify responsibilities, not an exact number of processes. This build is separate from application execution. The main processing route is a straight vertical spine; the version panel is separate configuration and stays static during the animation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
