<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="835" viewBox="0 0 1120 835" role="img" aria-labelledby="title desc">
<title id="title">Build: source-generation driver</title>
<desc id="desc">Current source-generation route: source models enter a JVM with an Xtext / ANTLR 3 parser, EMF source model and Rune semantic services; Java / Xtend generators write Java source. Selected model and toolchain versions are configuration. Measured generation-driver wall time includes file counting and reporting and excludes javac and tests. Median of three fresh JVMs: 91.263 seconds and 1,531 MiB peak working set; 351 source files produced 19,219 Java files. CDM 5.38.0, ISO 20022 1.38.0, DRR 6.34.1; Windows 11, Core Ultra 9 285K, JDK 21.0.8. Rune 9.83.0 with EMF-common 2.44.0 override. No phase attribution or future comparison is implied.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
