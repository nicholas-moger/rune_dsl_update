<rect x="30" y="675" width="1060" height="100" rx="14" fill="#18222f" stroke="#a6b0ec" stroke-width="1.5"/>
<text x="55" y="714" fill="#a6b0ec" font-size="24" font-weight="600" text-anchor="start">
<tspan x="55" dy="0" xml:space="preserve">Shared EMF source-model coupling</tspan>
