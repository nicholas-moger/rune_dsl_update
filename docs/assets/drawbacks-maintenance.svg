<tspan x="30" dy="0" xml:space="preserve">Language changes can affect several layers</tspan>
</text>
<text x="30" y="80" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="30" dy="0" xml:space="preserve">Possible impact paths · regenerate and test affected layers</tspan>
</text>
<text x="30" y="128" fill="#a9b7cb" font-size="20" font-weight="600" text-anchor="start">
