<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="805" viewBox="0 0 1120 805" role="img" aria-labelledby="title desc">
<title id="title">Language changes can affect several layers</title>
<desc id="desc">Possible change-impact map, not a mandatory sequence for every change. Rune grammar changes can require regeneration of framework-generated ANTLR 3 parsers; Xcore metamodel changes can require regeneration of framework-generated EMF classes. Shared EMF source-model coupling can affect Rune-owned semantic services and generator or editor consumers. Regenerate and test affected layers. This is a qualitative architecture observation, without elapsed times.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
