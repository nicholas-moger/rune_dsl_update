<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1450" viewBox="0 0 480 1450" role="img" aria-labelledby="title desc">
<title id="title">When failure text is formatted</title>
<desc id="desc">Conceptual failing-comparison path: format failure text eagerly, create ComparisonResult with Boolean and diagnostic, then a caller needs either Boolean or diagnostic text; eager text can remain unobserved. This does not mean every comparison or successful comparison formats a diagnostic. Separate retained U020 runtime experiment: eager versus deferred text. Time 8,527.481 plus/minus 411.588 versus 2,454.674 plus/minus 258.851 ms/op; allocation 30,790.11 plus/minus 121.15 versus 10,457.24 plus/minus 2.13 MB/op. Six JMH forks per variant; one operation runs 23 selected DRR report functions with synthetic inputs and reference Java held fixed. This is not production throughput, an IR gain, or a released Rune 9.83 baseline. Bars use separate scales for time and allocation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
<rect width="480" height="1450" rx="22" fill="#121923"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="24" y="43" fill="#eef2f8" font-size="29" font-weight="600" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">When failure text</tspan>
<tspan x="24" dy="35" xml:space="preserve">is formatted</tspan>
</text>
<text x="24" y="119" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">Conceptual failure path</tspan>
</text>
<rect x="24" y="170" width="432" height="85" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="25" y="189" width="4" height="47" rx="2" fill="#a2c6e6"/>
<text x="47" y="207" fill="#a2c6e6" font-size="24" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Failing comparison</tspan>
</text>
<text x="47" y="240" fill="#a9b7cb" font-size="21" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Condition is false</tspan>
</text>
<rect x="24" y="295" width="432" height="85" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="25" y="314" width="4" height="47" rx="2" fill="#d0b487"/>
<text x="47" y="332" fill="#d0b487" font-size="24" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Format failure text</tspan>
</text>
<text x="47" y="365" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Eager text may go unobserved</tspan>
</text>
<rect x="24" y="420" width="432" height="110" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="25" y="439" width="4" height="72" rx="2" fill="#a6b0ec"/>
<text x="47" y="457" fill="#a6b0ec" font-size="24" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">ComparisonResult</tspan>
</text>
<text x="47" y="490" fill="#a9b7cb" font-size="21" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Boolean + diagnostic text</tspan>
</text>
<rect x="24" y="570" width="432" height="120" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="25" y="589" width="4" height="82" rx="2" fill="#92d5c6"/>
<text x="47" y="607" fill="#92d5c6" font-size="24" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Caller need</tspan>
</text>
<text x="47" y="640" fill="#a9b7cb" font-size="21" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Boolean only</tspan>
<tspan x="47" dy="29" xml:space="preserve">or diagnostic text</tspan>
</text>
<polyline points="240,255 240,295" fill="none" stroke="#a9b7cb" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="240,380 240,420" fill="none" stroke="#a9b7cb" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="240,530 240,570" fill="none" stroke="#a9b7cb" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="24" y="730" width="432" height="515" rx="14" fill="#18222f" stroke="#d0b487" stroke-width="1.5"/>
<text x="47" y="773" fill="#d0b487" font-size="24" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Retained U020</tspan>
<tspan x="47" dy="29" xml:space="preserve">runtime experiment</tspan>
</text>
<text x="47" y="842" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Reported estimates + uncertainty</tspan>
</text>
<text x="47" y="884" fill="#eef2f8" font-size="23" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Time per operation</tspan>
</text>
<text x="47" y="921" fill="#d0b487" font-size="19" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Eager: 8,527.481 ± 411.588 ms/op</tspan>
</text>
<rect x="47" y="936" width="386" height="22" rx="4" fill="#d0b487" stroke="#d0b487" stroke-width="1.5"/>
<text x="47" y="989" fill="#92d5c6" font-size="19" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Deferred: 2,454.674 ± 258.851 ms/op</tspan>
</text>
<rect x="47" y="1004" width="111.11184698036853" height="22" rx="4" fill="#92d5c6" stroke="#92d5c6" stroke-width="1.5"/>
<text x="47" y="1084" fill="#eef2f8" font-size="23" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Allocation per operation</tspan>
</text>
<text x="47" y="1121" fill="#d0b487" font-size="19" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Eager: 30,790.11 ± 121.15 MB/op</tspan>
</text>
<rect x="47" y="1136" width="386" height="22" rx="4" fill="#d0b487" stroke="#d0b487" stroke-width="1.5"/>
<text x="47" y="1189" fill="#92d5c6" font-size="19" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Deferred: 10,457.24 ± 2.13 MB/op</tspan>
</text>
<rect x="47" y="1204" width="131.09711657412072" height="22" rx="4" fill="#92d5c6" stroke="#92d5c6" stroke-width="1.5"/>
<text x="24" y="1290" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">6 JMH forks per variant</tspan>
<tspan x="24" dy="27" xml:space="preserve">1 operation: 23 selected DRR</tspan>
<tspan x="24" dy="27" xml:space="preserve">report functions; synthetic inputs</tspan>
<tspan x="24" dy="27" xml:space="preserve">Reference Java held fixed</tspan>
<tspan x="24" dy="27" xml:space="preserve">Not production throughput</tspan>
<tspan x="24" dy="27" xml:space="preserve">or an IR gain</tspan>
</text>
</g>
</svg>
