<svg xmlns="http://www.w3.org/2000/svg" width="980" height="551" viewBox="0 0 980 551" role="img" aria-labelledby="title desc">
<title id="title">Rune DSL contribution roadmap</title><desc id="desc">Active 3.3 completes legacy Java IR generation, followed by 3.3.1 simplification, 3.4 SDK with LSP and editor parity, current Rune support and project-profile exploration, then 3.5 agent and MCP. Additional generation targets and model bridges are exploratory.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#e7edf4}.muted{fill:#b1bdcb}.teal{fill:#7ad4c0}.purple{fill:#aea7ff}.h{font-size:25px;font-weight:650}.p{font-size:20px}.s{font-size:17px}.label{font-size:16px;font-weight:700;letter-spacing:1px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8396ab" stroke-width="1.5"/></marker></defs>
<rect width="980" height="551" rx="12" fill="#1d242c"/><text x="30" y="43" class="h">Contribution roadmap</text><text x="30" y="73" class="p muted">Complete the generation route, then deliver the shared developer surfaces.</text><rect x="30" y="105" width="920" height="75" rx="8" fill="#27313d"/><text x="47" y="135" class="h teal">3.3</text><text x="47" y="160" class="label muted">ACTIVE</text><text x="185" y="135" class="h">Legacy Java through IR</text><text x="185" y="162" class="s muted">Complete native emission and retain compatibility checks.</text><rect x="30" y="194" width="920" height="75" rx="8" fill="#27313d"/><text x="47" y="224" class="h teal">3.3.1</text><text x="47" y="249" class="label muted">PLANNED</text><text x="185" y="224" class="h">Code simplification</text><text x="185" y="251" class="s muted">Consolidate responsibilities and improve maintainability.</text><rect x="30" y="283" width="920" height="75" rx="8" fill="#27313d"/><text x="47" y="313" class="h teal">3.4</text><text x="47" y="338" class="label muted">PLANNED</text><text x="185" y="313" class="h">SDK + LSP / editor</text><text x="185" y="340" class="s muted">Editor parity, current Rune support and profile exploration.</text><rect x="30" y="372" width="920" height="75" rx="8" fill="#27313d"/><text x="47" y="402" class="h teal">3.5</text><text x="47" y="427" class="label muted">PLANNED</text><text x="185" y="402" class="h">Agent / MCP surface</text><text x="185" y="429" class="s muted">Headless access through the same compiler and workspace APIs.</text><text x="30" y="494" class="label purple">EXPLORATORY FURTHER CONTRIBUTIONS</text><text x="30" y="525" class="p">Python via the SDK · optimised Java from IR · C# / Rust · model bridges</text></svg>