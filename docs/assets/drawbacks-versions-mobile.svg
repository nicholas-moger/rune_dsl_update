<tspan x="24" dy="0" xml:space="preserve">Version lines require</tspan>
<tspan x="24" dy="35" xml:space="preserve">coordinated migration</tspan>
</text>
<text x="24" y="119" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">Qualitative migration impact</tspan>
<tspan x="24" dy="26" xml:space="preserve">Model + toolchain versions</tspan>
</text>
