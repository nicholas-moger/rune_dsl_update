<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1860" viewBox="0 0 480 1860" role="img" aria-labelledby="title desc">
<title id="title">Rune DSL: source to application</title>
<desc id="desc">Stock Rune DSL 9.83.0 build route: .rosetta source, Xtext-generated ANTLR 3 lexer/parser, abstract syntax tree (AST) as Eclipse Modeling Framework (EMF) objects, scoping, type and cardinality checks and validation, Java generators implemented in Java and Xtend, generated Java, then compile and use an application. Generators use the EMF model and derived helpers. Runtime and handwritten application code are separate application inputs. The associated syntax node model retains text, offsets and comments and is not a second semantic AST. An editor can use Language Server Protocol (LSP) and the same core services; this does not imply a shared live model instance across processes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
