<title id="title">Rune DSL validation layers</title><desc id="desc">The test regime combines 25 pinned model-release cells, one versioned chaos corpus, focused and upstream tests, independent reference outputs and failure controls. Checks cover source semantics, generated-file comparisons, compilation and execution. Exact populations vary by check; TESTING.md defines them.</desc>
