<rect width="980" height="480" rx="12" fill="#1d242c"/><text x="30" y="43" class="h">Verification follows the generated result</text><text x="30" y="74" class="p muted">Pinned real models and reproducible adversarial cases exercise the same implementation.</text><rect x="30" y="106" width="435" height="145" rx="8" fill="#27313d" stroke="#435165"/><text x="50" y="140" class="label teal">INPUTS</text><text x="50" y="173" class="p">25 pinned model-release cells</text><text x="50" y="200" class="p">Chaos gate · versioned adversarial cases</text><text x="50" y="227" class="p">Fixtures + upstream reference cases</text><rect x="495" y="106" width="455" height="145" rx="8" fill="#27313d" stroke="#435165"/><text x="515" y="140" class="label teal">INDEPENDENT REFERENCES</text><text x="515" y="173" class="p">Released-compiler expectations</text><text x="515" y="200" class="p">IR on / off comparisons</text><text x="515" y="227" class="p">Failure controls that prove gates fire</text><path d="M247 251V270H733V251M176 270H804" fill="none" stroke="#8396ab" stroke-width="2"/><path d="M176 270L176 290" fill="none" stroke="#8396ab" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 270L490 290" fill="none" stroke="#8396ab" stroke-width="2" marker-end="url(#arrow)"/><path d="M804 270L804 290" fill="none" stroke="#8396ab" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="300" width="292" height="111" rx="8" fill="#27313d" stroke="#435165"/><text x="50" y="334" class="label teal">SOURCE + SEMANTICS</text><text x="50" y="367" class="p">Parse, resolve, validate</text><text x="50" y="394" class="p">Reconcile IR facts</text><rect x="344" y="300" width="292" height="111" rx="8" fill="#27313d" stroke="#435165"/><text x="364" y="334" class="label teal">GENERATED FILES</text><text x="364" y="367" class="p">Compare expected output</text><text x="364" y="394" class="p">Account for named gaps</text><rect x="658" y="300" width="292" height="111" rx="8" fill="#27313d" stroke="#435165"/><text x="678" y="334" class="label teal">COMPILE + EXECUTE</text><text x="678" y="367" class="p">Compile generated Java</text><text x="678" y="394" class="p">Compare runtime behaviour</text><text x="30" y="453" class="s muted">CI guide: triggers · required checks · external inputs · reports · local reproduction</text></svg>