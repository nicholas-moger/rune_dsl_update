</text>
<text x="24" y="1498" fill="#a2c6e6" font-size="19" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">Separate Python access demo: no JVM</tspan>
<tspan x="24" dy="29" xml:space="preserve">Same four answers · 106.587 s total</tspan>
</text>
