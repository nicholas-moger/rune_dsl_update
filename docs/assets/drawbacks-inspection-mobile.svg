</text>
<text x="47" y="255" fill="#a9b7cb" font-size="21" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">349 model files + 2 builtins</tspan>
<tspan x="47" dy="29" xml:space="preserve">CDM / ISO 20022 / DRR</tspan>
</text>
<rect x="24" y="350" width="432" height="155" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="25" y="369" width="4" height="117" rx="2" fill="#d0b487"/>
<text x="47" y="387" fill="#d0b487" font-size="24" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Rune 9.83.0 · JVM</tspan>
</text>
<text x="47" y="420" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Xtext / EMF load and resolve</tspan>
<tspan x="47" dy="28" xml:space="preserve">Extract / index / four questions</tspan>
<tspan x="47" dy="28" xml:space="preserve">90.799 s through answers</tspan>
</text>
<rect x="24" y="550" width="432" height="155" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="25" y="569" width="4" height="117" rx="2" fill="#92d5c6"/>
<text x="47" y="587" fill="#92d5c6" font-size="23" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Contribution Java · JVM</tspan>
</text>
<text x="47" y="620" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Parse / build plain-Java workspace</tspan>
<tspan x="47" dy="28" xml:space="preserve">Extract / index / four questions</tspan>
<tspan x="47" dy="28" xml:space="preserve">7.676 s through answers</tspan>
</text>
