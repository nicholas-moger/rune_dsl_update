<tspan x="24" dy="0" xml:space="preserve">Prepare a model, then</tspan>
<tspan x="24" dy="35" xml:space="preserve">answer questions</tspan>
</text>
<text x="24" y="119" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">One fresh-process run per lane</tspan>
<tspan x="24" dy="26" xml:space="preserve">Not warm request latency</tspan>
</text>
<rect x="24" y="185" width="432" height="110" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="25" y="204" width="4" height="72" rx="2" fill="#a2c6e6"/>
<text x="47" y="222" fill="#a2c6e6" font-size="24" font-weight="600" text-anchor="start">
