</text>
<text x="24" y="1320" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">CDM 5.38.0 · ISO 20022 1.38.0</tspan>
<tspan x="24" dy="29" xml:space="preserve">DRR 6.34.1 · Windows 11 · JDK 21.0.8</tspan>
<tspan x="24" dy="29" xml:space="preserve">Peak working set: 1,483 → 2,239 MiB</tspan>
