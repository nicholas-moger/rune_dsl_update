<tspan x="47" dy="33" xml:space="preserve">→ 284,248 structural tokens</tspan>
</text>
<text x="47" y="1223" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">351 files · 7,661 declarations</tspan>
