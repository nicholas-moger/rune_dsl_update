<svg xmlns="http://www.w3.org/2000/svg" width="480" height="796" viewBox="0 0 480 796" role="img" aria-labelledby="title desc">
<title id="title">Four perspectives on the current architecture</title>
<desc id="desc">Four category perspectives on the current architecture: Build and integrate, with model releases and toolchain pins; Maintain the language, with grammar, metamodel and services; Inspect and automate, with source model and semantic tooling; Execute at scale, with generated code and runtime. Cards are categories, not sequential process stages.</desc>
