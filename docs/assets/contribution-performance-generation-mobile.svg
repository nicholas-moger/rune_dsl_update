<tspan x="24" dy="0" xml:space="preserve">Generation measurements</tspan>
<tspan x="24" dy="38" xml:space="preserve">separate routes</tspan>
</text>
<text x="24" y="125" fill="#a9b7cb" font-size="22" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">Source generation only</tspan>
<tspan x="24" dy="30" xml:space="preserve">Independent paired measurements</tspan>
</text>
