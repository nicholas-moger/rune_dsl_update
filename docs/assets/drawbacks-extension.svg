<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1145" viewBox="0 0 1120 1145" role="img" aria-labelledby="title desc">
<title id="title">Extending Rune through explicit model mappings</title>
<desc id="desc">Qualitative integration and ownership impact. Illustrative external or legacy model definitions pass through a custom import/mapping adapter into Rune sources, then a JVM with Xtext, an EMF source model and Rune services. A custom export/mapping adapter supplies another metamodel or tool. Dashed incoming and outgoing source paths are custom mappings with supported constructs defined per adapter. Mappings need semantic contracts and unsupported-case handling; semantic identity and full round trips are not guaranteed. Existing external annotations and RosettaExternalSynonymSource mapping capabilities exist. Existing generator/model APIs let extension code consume framework-model interfaces. New model input formats require custom conversion, not necessarily a grammar fork. This illustrates boundaries and responsibilities, not the absence of extension capabilities, impossible bridges or a shipped future SDK.</desc>
