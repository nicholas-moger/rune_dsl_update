<tspan x="30" dy="0" xml:space="preserve">Goals for the next evolution</tspan>
</text>
<text x="30" y="85" fill="#a9b7cb" font-size="22" font-weight="400" text-anchor="start">
<tspan x="30" dy="0" xml:space="preserve">Intended outcomes · compatibility and adoption remain acceptance gates</tspan>
</text>
