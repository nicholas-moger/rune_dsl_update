<text x="783" y="753" fill="#92d5c6" font-size="24" font-weight="600" text-anchor="start">
<tspan x="783" dy="0" xml:space="preserve">Editor + LSP</tspan>
</text>
<text x="783" y="786" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="783" dy="0" xml:space="preserve">Protocol for language features</tspan>
</text>
<text x="30" y="842" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="30" dy="0" xml:space="preserve">Model tests check behaviour; language tests also check syntax, semantics, generation and compatibility.</tspan>
</text>
