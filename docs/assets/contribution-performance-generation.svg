<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1060" viewBox="0 0 1120 1060" role="img" aria-labelledby="title desc">
<title id="title">Generation measurements · separate routes</title>
<desc id="desc">Separate retained source-generation pairs, not complete builds or native IR emission. Direct generation medians from three fresh JVM runs per mode: 91.263 to 14.492 seconds driver wall time; 19,219 Java files per route are equal after line-ending normalization. Direct median Windows peak working set increases from 1,531 to 2,112 MiB. Separate Maven clean generate-sources medians: 45.622 to 19.154 seconds; 19,216 equal files plus three package-info description-ordering differences, no extra or missing paths. No Maven memory measurement. The replacement direct route is the retained LEGACY generation route, not proof of native IR performance. Ratios are not cumulative.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
