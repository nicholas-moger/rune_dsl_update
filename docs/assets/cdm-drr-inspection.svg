<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="765" viewBox="0 0 1120 765" role="img" aria-labelledby="title desc">
<title id="title">Inspect definitions and analyse data</title>
<desc id="desc">A semantic definition question, such as a field&#x27;s type, cardinality or referenced declaration, can reach existing JVM Rune language services over a loaded EMF source model through the editor/LSP, or through an illustrative custom inspection adapter. Results are definition details and source references. A separate transaction/example decision uses generated code and runtime in Java, or Python where supported, to compute an application-data result. EMF source models are not trade instances. Source text can also be read directly without a Rune JVM. Custom adapters do not imply a shipped general query API.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
