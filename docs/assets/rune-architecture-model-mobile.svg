<polyline points="433,735 466,735 466,1270 433,1270" fill="none" stroke="#a9b7cb" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="24" y="903" fill="#d0b487" font-size="21" font-weight="400" text-anchor="start">
