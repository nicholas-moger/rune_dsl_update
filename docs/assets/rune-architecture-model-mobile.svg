<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1535" viewBox="0 0 480 1535" role="img" aria-labelledby="title desc">
<title id="title">One EMF model can link two files</title>
<desc id="desc">Miniature structural illustration, not runtime data or an exact memory dump. Resource orders.rosetta contains RosettaModel with namespace example.orders. Its elements include Data named Order, whose attributes include Attribute named product, whose typeCall is a TypeCall. TypeCall.type cross-references the Data named Product, a RosettaType declaration in the RosettaModel with namespace example.products in Resource products.rosetta. Solid arrows indicate containment; the dashed arrow indicates a cross-reference between the two containment trees.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
<rect width="480" height="1535" rx="22" fill="#121923"/>
<g font-family="Segoe UI, Arial, sans-serif">
