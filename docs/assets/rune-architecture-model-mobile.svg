<tspan x="24" dy="0" xml:space="preserve">One EMF model</tspan>
<tspan x="24" dy="35" xml:space="preserve">can link two files</tspan>
</text>
<text x="24" y="119" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">Miniature structural illustration;</tspan>
