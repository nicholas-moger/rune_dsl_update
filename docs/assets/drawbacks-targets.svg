<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1030" viewBox="0 0 1120 1030" role="img" aria-labelledby="title desc">
<title id="title">Shared front end, target-specific implementations</title>
<desc id="desc">Qualitative release-specific architecture illustration, not a combined compatibility matrix or a shared live model instance across versions. Common Rune source is parsed and linked through Xtext / ANTLR 3 and Rune services into an EMF source model on the JVM. Framework-model interfaces feed a built-in Java generator in the Rune repository and a separately maintained external Python generator; both generation implementations run on the JVM. The Java illustration uses the guide&#x27;s 9.83.0 baseline; the external Python illustration selects Rune 10.14.0. Generated Java uses a Java runtime in a Java application JVM; generated Python uses its own Python runtime in a Python application. Target expression implementations, runtime packages, versions and supported features must be coordinated. Shared semantics must be kept aligned across target implementations. Repository organisation is not itself a defect or a necessity, and Python is not impossible in Xtext.</desc>
