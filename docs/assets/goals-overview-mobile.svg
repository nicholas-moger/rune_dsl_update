<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1230" viewBox="0 0 480 1230" role="img" aria-labelledby="title desc">
<title id="title">Goals for the next evolution</title>
<desc id="desc">Six intended outcomes for the next evolution of Rune, not claims of delivered functionality. Compatibility and adoption remain acceptance gates. Preserve existing models: keep Rune source and established Java contracts usable. Own language maintenance: clear responsibilities and fewer framework-coupled change paths. Extend models and targets: reuse semantic facts across backends and explicit model mappings. Open model and AI access: query relevant facts and validate changes through headless services. Reduce avoidable work: improve generation, model access and runtime costs, measuring each separately. Equip developers: a standalone SDK for extending, testing and debugging the language. These are objectives, not process stages, confirmed compatibility or a shipped SDK.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
