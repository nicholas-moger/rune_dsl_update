<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1090" viewBox="0 0 1120 1090" role="img" aria-labelledby="title desc">
<title id="title">Runtime experiments · independent pairs</title>
<desc id="desc">Three independent retained runtime experiments, six JMH forks per variant in each pair. U020 lazy failure text: 8,527.481 to 2,454.674 ms/op and 30,790.11 to 10,457.24 MB/op. U021 parent-linked mapper-path lineage: 2,617.369 to 2,031.881 ms/op and 10,096.20 to 8,271.87 MB/op. U022 deferred mapper-path construction: 1,970.522 to 1,260.064 ms/op and 8,224.56 to 7,272.61 MB/op. These are point estimates; exact reported uncertainty is in the accompanying evidence. Each operation invokes 23 selected DRR report functions over synthetic inputs with reference-generated Java held fixed. Baselines differ; ratios are not cumulative. This is not production throughput, native IR improvement or all DRR coverage.</desc>
