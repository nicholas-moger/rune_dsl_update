<rect x="335" y="346" width="4" height="66" rx="2" fill="#92d5c6"/>
<text x="357" y="364" fill="#92d5c6" font-size="22" font-weight="600" text-anchor="start">
<tspan x="357" dy="0" xml:space="preserve">CDM functions</tspan>
