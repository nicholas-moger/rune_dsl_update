<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
<title id="title">Run generated CDM and DRR logic</title>
<desc id="desc">Code generation precedes these separate execution lanes. In a Java application JVM, integration inputs populate generated CDM trade or event objects. The application uses applicable CDM functions/validation or DRR report functions; data can go directly to reporting without prior lifecycle-function execution. Shared Java runtime and application code support the application. A separate Python lane uses generated CDM Python models and Python runtime for a Python application or data analysis where supported. No arrow connects Java and Python; no Python DRR or complete function parity is implied.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
<rect width="1120" height="800" rx="22" fill="#121923"/>
<g font-family="Segoe UI, Arial, sans-serif">
