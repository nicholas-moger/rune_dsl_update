<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1610" viewBox="0 0 480 1610" role="img" aria-labelledby="title desc">
<title id="title">Contribution design · target route</title>
<desc id="desc">Final desired contribution route, not a claim that full Java-through-IR compatibility is delivered: .rosetta source, direct ANTLR 4 parser, Java AST and owned semantic services for workspace, resolution, types, cardinality and validation, shared semantic IR, Java emitter, generated Java. The downstream Java application executes generated Java with runtime support and handwritten application code; the runtime is not IR execution. LSP, SDK and CLI are static side consumers of the same planned semantic services, not mandatory compiler stages. The highlight order is an explanatory route, not benchmark timing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
