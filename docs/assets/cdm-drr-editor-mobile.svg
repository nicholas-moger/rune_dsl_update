<tspan x="24" dy="0" xml:space="preserve">Develop models</tspan>
<tspan x="24" dy="35" xml:space="preserve">in the editor</tspan>
</text>
<text x="24" y="119" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">Editor requests use LSP.</tspan>
<tspan x="24" dy="26" xml:space="preserve">Rune language services run in a JVM.</tspan>
</text>
