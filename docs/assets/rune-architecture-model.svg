<tspan x="30" dy="0" xml:space="preserve">One EMF model can link two files</tspan>
</text>
<text x="30" y="80" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="30" dy="0" xml:space="preserve">Miniature structural illustration · not runtime data or an exact memory dump</tspan>
</text>
