<tspan x="30" dy="0" xml:space="preserve">Develop models in the editor</tspan>
</text>
<text x="30" y="80" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="30" dy="0" xml:space="preserve">Request → source-model services → editor response</tspan>
</text>
