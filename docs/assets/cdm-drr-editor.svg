<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Develop models in the editor</title>
<desc id="desc">The editor sends edits or language requests over Language Server Protocol (LSP) to the Rune language server, which runs in a Java Virtual Machine (JVM). Xtext integrates ANTLR 3 source lexing/parsing and a separate IDE content-assist parser. Xtext/Eclipse Modeling Framework (EMF) resource and reference services handle source-model objects and links between declarations. Rune scoping, type and cardinality services and validation support completion, navigation and diagnostics returned to the editor. LSP is the exchange protocol, not a JVM process. The animation highlights responsibilities in request-response order, not measured timing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
