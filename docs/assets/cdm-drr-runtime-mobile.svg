<text x="70" y="317" fill="#a2c6e6" font-size="24" font-weight="600" text-anchor="start">
<tspan x="70" dy="0" xml:space="preserve">Integration input</tspan>
</text>
<text x="70" y="350" fill="#a9b7cb" font-size="21" font-weight="400" text-anchor="start">
<tspan x="70" dy="0" xml:space="preserve">Transaction / event data</tspan>
</text>
<rect x="47" y="410" width="386" height="555" rx="14" fill="#18222f" stroke="#92d5c6" stroke-width="1.5"/>
<text x="70" y="448" fill="#92d5c6" font-size="24" font-weight="600" text-anchor="start">
<tspan x="70" dy="0" xml:space="preserve">Java application · JVM</tspan>
</text>
