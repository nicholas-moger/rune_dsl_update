<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1880" viewBox="0 0 480 1880" role="img" aria-labelledby="title desc">
<title id="title">Model access and context measurements</title>
<desc id="desc">Two separate retained experiments. Java first prepared model access: 90.799 to 7.676 seconds, including process startup, parsing, semantic preparation, extraction/indexing and the same four structural answer sets over 351 source files. One fresh process per Java lane; both require the JVM. Median or warm request latency is not established. Peak Windows working set increases from 1,483 to 2,239 MiB. Separate Python parser/index context experiment over 351 files and 7,661 declarations: full Rune source 1,894,552 tokens versus selected structural digest 284,248 tokens, using o200k_base and tiktoken0.14.0. The digest omits prose, mappings and expression/rule bodies; it does not replace full source semantics. Warm requests, network latency and AI answer quality were not measured. Neither experiment demonstrates a complete standalone SDK or JVM-free Java model access. No ratio or combined performance claim.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
