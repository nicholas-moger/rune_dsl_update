<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1095" viewBox="0 0 1120 1095" role="img" aria-labelledby="title desc">
<title id="title">A standalone SDK · proposed service groups</title>
<desc id="desc">Proposed standalone SDK service groupings: workspace for loading model/project contexts and selecting versions and dependencies; semantics for symbols, types, cardinality, resolution and validation; IR and targets for semantic IR, emitter contracts and coverage; regression and trace for reproduction, output comparison and source/semantic facts. Rune Studio, CLI, LSP and agent/MCP clients are planned clients of those services. Packaging names are illustrative, not shipped artifacts. Separate existing foundation modules: rune-parser, rune-java-generator, rune-ir, rune-ir-java, rune-ir-java-optimised, rune-runtime and rune-maven-plugin. Those foundations are not a claim that the standalone SDK is delivered.</desc>
