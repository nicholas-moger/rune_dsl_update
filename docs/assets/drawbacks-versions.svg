<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
<title id="title">Version lines require coordinated migration</title>
<desc id="desc">Two official released model/toolchain selections: CDM 6.27.0 selects Rune 9.92.1 in the 9.x lane; CDM 7.0.0 selects Rune 10.2.2 in the 10.x lane. Each path is model source, selected generator and runtime, then application. Breaking validation, choice syntax and navigation changes require model migration and coordinated pins, while parallel version-line maintenance continues. This is a qualitative migration impact and two-release example, not a complete compatibility matrix or an attribution of the version split to Xtext.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
