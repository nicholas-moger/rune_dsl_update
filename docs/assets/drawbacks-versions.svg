</text>
<rect x="840" y="160" width="250" height="110" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="841" y="179" width="4" height="72" rx="2" fill="#d0b487"/>
<text x="863" y="197" fill="#d0b487" font-size="24" font-weight="600" text-anchor="start">
<tspan x="863" dy="0" xml:space="preserve">Application</tspan>
</text>
