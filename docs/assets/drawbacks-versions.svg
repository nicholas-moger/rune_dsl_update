<tspan x="30" dy="0" xml:space="preserve">Version lines require coordinated migration</tspan>
</text>
<text x="30" y="80" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="30" dy="0" xml:space="preserve">Qualitative migration impact · two released model/toolchain paths</tspan>
</text>
<text x="30" y="133" fill="#a2c6e6" font-size="21" font-weight="600" text-anchor="start">
