</text>
<text x="53" y="230" fill="#a9b7cb" font-size="21" font-weight="400" text-anchor="start">
<tspan x="53" dy="0" xml:space="preserve">.rosetta source</tspan>
</text>
<rect x="400" y="160" width="370" height="110" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="401" y="179" width="4" height="72" rx="2" fill="#a6b0ec"/>
<text x="423" y="197" fill="#a6b0ec" font-size="24" font-weight="600" text-anchor="start">
<tspan x="423" dy="0" xml:space="preserve">Rune 9.92.1</tspan>
</text>
<text x="423" y="230" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
