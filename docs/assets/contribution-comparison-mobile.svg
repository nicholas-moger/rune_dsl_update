<svg xmlns="http://www.w3.org/2000/svg" width="480" height="2180" viewBox="0 0 480 2180" role="img" aria-labelledby="title desc">
<title id="title">Same compiler roles, different foundations</title>
<desc id="desc">Four matched roles compare stock Rune 9.83.0 with the proposed contribution target: parsing, semantic model and services, code generation, and downstream application execution. Stock Xtext integrates ANTLR 3 with an EMF source graph and Rune semantic services; Java and Xtend generators emit Java. Its existing JVM language server and editor use those source-model services. The proposed direct ANTLR 4 parser creates a Java AST, with project-owned semantic services and a distinct shared semantic IR of prepared facts for emitters. The IR is an additional representation, not a claim of fewer compiler stages. The target Java emitter consumes that IR. Generated Java and the downstream runtime retain their application role, with compatibility a completion goal. The planned standalone SDK exposes owned services through CLI, Studio, replacement LSP and agent interfaces. It is connected only to the proposed semantic boundary. No new SDK or full IR closure is claimed delivered; other language targets are separate work.</desc>
