<svg xmlns="http://www.w3.org/2000/svg" width="980" height="450" viewBox="0 0 980 450" role="img" aria-labelledby="title desc">
<title id="title">Recorded generation, runtime and AI context results</title><desc id="desc">Three separate historical experiments: source-to-Java generation 6.30 times faster on 351 sources; lazy failure-message runtime change 3.47 times faster and 66.0 percent less allocation on fixed generated Java; structural AI context 6.67 times smaller for 351 files and 7,661 declarations. These use different comparisons and are not cumulative.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#e7edf4}.muted{fill:#b1bdcb}.teal{fill:#7ad4c0}.purple{fill:#aea7ff}.h{font-size:25px;font-weight:650}.p{font-size:20px}.s{font-size:17px}.label{font-size:16px;font-weight:700;letter-spacing:1px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8396ab" stroke-width="1.5"/></marker></defs>
<rect width="980" height="450" rx="12" fill="#1d242c"/><text x="30" y="43" class="h">Measured improvements at distinct stages</text><text x="30" y="73" class="p muted">Recorded experiments · methods and inputs linked below</text><rect x="30" y="106" width="292" height="227" rx="8" fill="#27313d"/><text x="50" y="139" class="label teal">SOURCE → JAVA</text><text x="50" y="204" font-size="53" font-weight="700" fill="#aea7ff">6.30×</text><text x="50" y="241" class="s">91.263 s → 14.492 s</text><text x="50" y="270" class="s">351 source files</text><text x="50" y="299" class="s">Median of three runs</text><rect x="344" y="106" width="292" height="227" rx="8" fill="#27313d"/><text x="364" y="139" class="label teal">RUNTIME CHANGE</text><text x="364" y="204" font-size="53" font-weight="700" fill="#aea7ff">3.47×</text><text x="364" y="241" class="s">8,527.5 → 2,454.7 ms/op</text><text x="364" y="270" class="s">Lazy failure messages</text><text x="364" y="299" class="s">66.0% less allocation</text><rect x="658" y="106" width="292" height="227" rx="8" fill="#27313d"/><text x="678" y="139" class="label teal">AI STRUCTURAL CONTEXT</text><text x="678" y="204" font-size="53" font-weight="700" fill="#aea7ff">6.67×</text><text x="678" y="241" class="s">1,894,552 → 284,248 tokens</text><text x="678" y="270" class="s">351 files · 7,661 declarations</text><text x="678" y="299" class="s">Source → structural digest</text><text x="30" y="370" class="s muted">Generation: CDM 5.38.0 + DRR 6.34.1 + ISO 20022 1.38.0, including builtins.</text><text x="30" y="396" class="s muted">Runtime: fixed generated Java; 23 report calls/op; six JMH forks per leg.</text><text x="30" y="422" class="s muted">AI: selective structural context; token reduction measured without an LLM call.</text></svg>