</text>
<text x="47" y="255" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Rune language definition</tspan>
</text>
<rect x="24" y="315" width="432" height="90" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="25" y="334" width="4" height="52" rx="2" fill="#a2c6e6"/>
<text x="47" y="352" fill="#a2c6e6" font-size="24" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">ANTLR 3 parsers</tspan>
</text>
