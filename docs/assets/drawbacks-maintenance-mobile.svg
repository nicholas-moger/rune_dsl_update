<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1330" viewBox="0 0 480 1330" role="img" aria-labelledby="title desc">
<title id="title">Language changes can affect several layers</title>
<desc id="desc">Possible change-impact map, not a mandatory sequence for every change. Rune grammar changes can require regeneration of framework-generated ANTLR 3 parsers; Xcore metamodel changes can require regeneration of framework-generated EMF classes. Shared EMF source-model coupling can affect Rune-owned semantic services and generator or editor consumers. Regenerate and test affected layers. This is a qualitative architecture observation, without elapsed times.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
<rect width="480" height="1330" rx="22" fill="#121923"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="24" y="43" fill="#eef2f8" font-size="29" font-weight="600" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">Language changes can</tspan>
<tspan x="24" dy="35" xml:space="preserve">affect several layers</tspan>
</text>
<text x="24" y="119" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">Possible impact paths</tspan>
<tspan x="24" dy="26" xml:space="preserve">Regenerate / test affected layers</tspan>
</text>
<rect x="24" y="185" width="432" height="90" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="25" y="204" width="4" height="52" rx="2" fill="#a2c6e6"/>
<text x="47" y="222" fill="#a2c6e6" font-size="23" font-weight="600" text-anchor="start">
