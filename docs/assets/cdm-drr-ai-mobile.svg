<tspan x="70" dy="0" xml:space="preserve">Configured tools / adapters</tspan>
</text>
<text x="70" y="510" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="70" dy="0" xml:space="preserve">Select tools and supply context</tspan>
</text>
<rect x="47" y="595" width="386" height="115" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="48" y="614" width="4" height="77" rx="2" fill="#a2c6e6"/>
<text x="70" y="632" fill="#a2c6e6" font-size="24" font-weight="600" text-anchor="start">
<tspan x="70" dy="0" xml:space="preserve">Source / context access</tspan>
</text>
<text x="70" y="665" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="70" dy="0" xml:space="preserve">Read files directly</tspan>
<tspan x="70" dy="28" xml:space="preserve">No Rune JVM needed</tspan>
</text>
<rect x="47" y="750" width="386" height="115" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
