<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1560" viewBox="0 0 480 1560" role="img" aria-labelledby="title desc">
<title id="title">Use AI through configured tools</title>
<desc id="desc">Illustrative integration. An optional external AI/agent client uses configured external tools/adapters. Adapters can read source/context directly without a Rune JVM, access existing Rune language/model services in a JVM, or use existing build/test tools with JVM roles. These are parallel available capabilities, not mandatory processing stages. Evidence and a proposed change reach human review. The AI does not have to run on a JVM. No native Rune AI platform, API or SDK availability is claimed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a9b7cb" stroke-width="1.4"/></marker></defs>
<rect width="480" height="1560" rx="22" fill="#121923"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="24" y="43" fill="#eef2f8" font-size="29" font-weight="600" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">Use AI through</tspan>
<tspan x="24" dy="35" xml:space="preserve">configured tools</tspan>
</text>
<text x="24" y="119" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">Illustrative integration</tspan>
<tspan x="24" dy="26" xml:space="preserve">External adapters use existing services.</tspan>
</text>
<rect x="24" y="180" width="432" height="100" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="25" y="199" width="4" height="62" rx="2" fill="#a2c6e6"/>
<text x="47" y="217" fill="#a2c6e6" font-size="24" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">AI / agent client</tspan>
</text>
<text x="47" y="250" fill="#a9b7cb" font-size="21" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">External, optional integration</tspan>
</text>
<rect x="24" y="325" width="432" height="800" rx="14" fill="#18222f" stroke="#a6b0ec" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="47" y="363" fill="#a6b0ec" font-size="23" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">External adapter boundary</tspan>
</text>
<text x="47" y="395" fill="#a9b7cb" font-size="19" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Configured illustrative integration</tspan>
</text>
<rect x="47" y="440" width="386" height="110" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="48" y="459" width="4" height="72" rx="2" fill="#a2c6e6"/>
