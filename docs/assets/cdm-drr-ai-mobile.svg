<text x="47" y="1207" fill="#a6b0ec" font-size="24" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Evidence + proposed change</tspan>
</text>
<text x="47" y="1240" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
