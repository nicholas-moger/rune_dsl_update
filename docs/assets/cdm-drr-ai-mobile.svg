</text>
<rect x="24" y="1320" width="432" height="110" rx="14" fill="#18222f" stroke="#344153" stroke-width="1.5"/>
<rect x="25" y="1339" width="4" height="72" rx="2" fill="#92d5c6"/>
<text x="47" y="1357" fill="#92d5c6" font-size="24" font-weight="600" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Human review</tspan>
</text>
<text x="47" y="1387" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="47" dy="0" xml:space="preserve">Accept, revise or reject</tspan>
<tspan x="47" dy="28" xml:space="preserve">before applying a change</tspan>
</text>
<polyline points="240,1280 240,1320" fill="none" stroke="#a9b7cb" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="24" y="1470" fill="#a9b7cb" font-size="20" font-weight="400" text-anchor="start">
<tspan x="24" dy="0" xml:space="preserve">Adapters are illustrative.</tspan>
<tspan x="24" dy="28" xml:space="preserve">No native Rune AI API / SDK</tspan>
<tspan x="24" dy="28" xml:space="preserve">is implied by this integration.</tspan>
</text>
</g>
</svg>
