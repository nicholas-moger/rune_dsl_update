<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="950" viewBox="0 0 1120 950" role="img" aria-labelledby="title desc">
<title id="title">Prepare a model, then answer questions</title>
<desc id="desc">The retained prepare-then-inspect experiment loaded CDM 5.38.0, ISO 20022 1.38.0 and DRR 6.34.1: 349 model files plus two builtins. A single fresh JVM run per lane measured process start through semantic preparation, extraction, indexing and four matching structural answer sets: 90.799 seconds with released Rune 9.83.0 Xtext/EMF and 7.676 seconds with the contribution Java parser/workspace. Legacy resolveAll took 87.587 seconds; replacement workspace build took 3.084 seconds. This is not warm LSP or network request latency, and the four queries use declared-name facts. Windows peak working set increased from 1483 to 2239 MiB. A separate Python prototype experiment compared 1894552 complete-source tokens with 284248 selective structural-digest tokens over 351 files and 7661 declarations using o200k_base. The digest omits prose, mappings and expression/rule bodies; no LLM quality was tested.</desc>
