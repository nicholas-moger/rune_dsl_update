<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1660" viewBox="0 0 480 1660" role="img" aria-labelledby="title desc">
<title id="title">Contribution stages and priorities</title>
<desc id="desc">Historical snapshot, 22 September 2026, not a delivery schedule, ETA or percentage-complete claim. Foundation stages 1.0 compiler, 2.0 IR foundation, 3.0 optimised AST route and runtime, 3.1 resolution, 3.2 adversarial. Active in this snapshot: 3.3 complete IR route. Next: 3.3.1 simplify. Later planned: 3.4 SDK and LSP; 3.5 agent MCP. Stage 3.3 names the completion goal, not a statement that full IR compatibility has already been delivered. Root prose separately describes current progress.</desc>
