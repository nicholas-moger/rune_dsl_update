<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" role="img" aria-labelledby="title desc">
<title id="title">Rune DSL compiler architecture</title><desc id="desc">Rune source feeds an ANTLR4 parser and plain Java AST, semantic services, then direct compatibility generation or IR-assisted generation. Generated Java uses the adapted Rune runtime. Optimised generation remains AST hosted with IR-selected transformations.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#e7edf4}.muted{fill:#b1bdcb}.teal{fill:#7ad4c0}.purple{fill:#aea7ff}.h{font-size:25px;font-weight:650}.p{font-size:20px}.s{font-size:17px}.label{font-size:16px;font-weight:700;letter-spacing:1px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8396ab" stroke-width="1.5"/></marker></defs>
<rect width="980" height="480" rx="12" fill="#1d242c"/><text x="30" y="43" class="h">Rune semantics, explicit compiler services</text><text x="30" y="73" class="p muted">Replacement path: ANTLR4 + Java AST + shared IR</text><rect x="30" y="102" width="190" height="115" rx="8" fill="#27313d" stroke="#435165"/><text x="50" y="136" class="label teal">SOURCE</text><text x="50" y="169" class="p">Rune models</text><text x="50" y="196" class="p">.rosetta files</text><path d="M220 160L249 160" fill="none" stroke="#8396ab" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="102" width="290" height="115" rx="8" fill="#27313d" stroke="#435165"/><text x="280" y="136" class="label teal">PARSE</text><text x="280" y="169" class="p">ANTLR4 parser</text><text x="280" y="196" class="p">Plain Java AST</text><path d="M550 160L579 160" fill="none" stroke="#8396ab" stroke-width="2" marker-end="url(#arrow)"/><rect x="590" y="102" width="360" height="115" rx="8" fill="#27313d" stroke="#435165"/><text x="610" y="136" class="label teal">SEMANTIC SERVICES</text><text x="610" y="169" class="p">Resolve names and types</text><text x="610" y="196" class="p">Cardinality and validation</text><path d="M770 217L770 251" fill="none" stroke="#8396ab" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="262" width="425" height="118" rx="8" fill="#27313d" stroke="#435165"/><text x="50" y="296" class="label teal">DIRECT GENERATION</text><text x="50" y="329" class="p">AST → compatibility Java</text><text x="50" y="356" class="p">Established output contract</text><rect x="485" y="262" width="465" height="118" rx="8" fill="#27313d" stroke="#435165"/><text x="505" y="296" class="label teal">IR-ASSISTED GENERATION</text><text x="505" y="329" class="p">Shared declaration + expression IR</text><text x="505" y="356" class="p">Compatibility or optimised selection</text><path d="M670 217V236H242V252" fill="none" stroke="#8396ab" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="423" class="p">Generated Java uses the Rune runtime and companion libraries.</text><text x="30" y="454" class="s muted">Parser, AST and generators: new implementation · runtime: adapted upstream code</text></svg>