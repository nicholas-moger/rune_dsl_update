      <g font-size="15" fill="#9eacc0"><text x="110" y="149">Preserve established</text><text x="110" y="172">model and output contracts</text><text x="330" y="149">Clearer services and</text><text x="330" y="172">language-change workflows</text><text x="550" y="149">Reusable semantics</text><text x="550" y="172">and extension points</text><text x="770" y="149">Measured generation</text><text x="770" y="172">and runtime improvements</text><text x="990" y="149">SDK, editor services</text><text x="990" y="172">and automation</text></g>
