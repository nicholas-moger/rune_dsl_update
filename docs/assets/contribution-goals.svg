<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="218" viewBox="0 0 1100 218" role="img" aria-labelledby="title desc">
  <title id="title">The contribution's five design goals</title>
  <desc id="desc">Compatibility: preserve existing behaviour. Maintainability: clearer services and change workflows. Extensibility: reusable semantics and extension points. Performance: measured generation and runtime improvements. Developer access: SDK, editor and automation services. These are goals with different delivery stages.</desc>
